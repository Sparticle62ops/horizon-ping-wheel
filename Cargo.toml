[package]
name = "ping-wheel"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Exact 1:1 Rust translation of Ping Wheel by LukenSkyne (MIT)"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }

[profile.test]
opt-level = 0
